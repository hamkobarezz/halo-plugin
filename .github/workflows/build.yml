# Builds HALO on GitHub's machines:
#   macOS  -> HALO-<ver>-macOS.dmg  (Logic Pro AU + VST3 + app, universal)
#   Windows-> HALO-<ver>-Windows-Setup.exe
#   iPad   -> AUv3 compile check (installing on an iPad needs Xcode + your Apple ID, see packaging/ios)
# Download the results from the run page under "Artifacts".
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git JUCE
      - name: Build DMG
        env:
          HALO_APP_SIGN_ID: ${{ secrets.HALO_APP_SIGN_ID }}
          HALO_PKG_SIGN_ID: ${{ secrets.HALO_PKG_SIGN_ID }}
        run: |
          chmod +x packaging/mac/build_dmg.sh
          packaging/mac/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HALO-macOS
          path: dist/*.dmg

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git JUCE
      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HALO-Windows
          path: dist/*-Windows-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"; T="${{ github.ref_name }}"
          gh release view "$T" --repo "$R" >/dev/null 2>&1 || gh release create "$T" --repo "$R" --title "HALO $T" --generate-notes
          gh release upload "$T" out/HALO-macOS/*.dmg out/HALO-Windows/*.exe --repo "$R" --clobber

  ipad:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git JUCE
      - name: Build AUv3 (unsigned compile check)
        run: |
          chmod +x packaging/ios/build_ipad.sh
          packaging/ios/build_ipad.sh
